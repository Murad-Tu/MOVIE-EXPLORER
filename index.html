<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>JS For Beginners</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
   <header>
    <div class="internal-wrapper">
      <div class="logo"><img src="resources/logo.png" alt=""></div>
      <nav class="navigation">
          <a href="#" class="active">Home</a>
          <a href="">Popular</a>
          <a href="">Top rated</a>
          <a href="">Upcoming</a>
        
      </nav>
      <div class="myWatchlist">
        <span style="color:red;"><i class="fa-regular fa-heart"></i></span>
        <span>my watchlist</span>
        <span class="count" style="background-color: rgb(255, 174, 0); border-radius: 50%;">5</span>
      </div>
      <div class="darkMode">
        <span><i class="fa-regular fa-moon"></i></span> 
       <span><i class="fa-solid fa-toggle-on"></i></span> 
      </div>
    </div>
   </header>
   <section class="findYourMovie">
    <div class="internalFindYourMovie">
      <div class="findText">
        <h3>Find Your Next</h3>
        <h1>Favorite Movie</h1>
        <p>seaarch millions of movies and add them to your watchlist.</p>
      </div>
      <div class="searchBtn">
        <span style="color: black; bcgc"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" placeholder="search for movie...">
        <span class="search"><button type="submit">search</button></span>
      </div>
      <div class="categories">
        <a href="">All</a>
        <a href="">Action</a>
        <a href="">Adventures</a>
        <a href="">Comedy</a>
        <a href="">Drama</a>
        <a href="">Horror</a>
        <a href="">Sci-fi</a>
        <a href="">Romance</a>

      </div>
    </div>
   </section>
    <script src="./js/script.js"></script>
  </body>
</html>
